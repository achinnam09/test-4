[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quotebot"
version = "1.0.0"
description = "Fetch and format currency exchange rates from the command line"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "requests==2.34.2",
    "click==8.4.2",
    "rich==15.0.0",
    "python-dotenv==1.2.2",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==6.2.5",
    "responses==0.14.0",
]

[project.scripts]
quotebot = "quotebot.cli:main"
